name: Trancher en G-code
on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: slice
  cancel-in-progress: false
jobs:
  slice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer PrusaSlicer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends prusa-slicer xvfb
      - name: Trancher les jobs
        run: node tools/slice.js
      - name: Publier les G-code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output jobs
          git diff --cached --quiet || (git commit -m "G-code généré" && git pull --rebase && git push)
